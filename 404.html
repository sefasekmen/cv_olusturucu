<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sayfa bulunamadı. Online CV Oluşturucu.">
    <title>404 - Sayfa Bulunamadı | Online CV Oluşturucu</title>
    <link rel="icon" type="image/webp" href="logo.webp">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Ana stil dosyası -->
    <link rel="stylesheet" href="styles/style.css">

    <style>
        .error-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .error-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4rem 3rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--cherry-ruby), var(--pink-powder));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(194, 0, 0, 0.3);
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 1.5rem;
        }

        .error-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--cherry-ruby), var(--cherry-bright));
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(194, 0, 0, 0.3);
        }

        .error-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 25px rgba(194, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <!-- ===== CANVAS ARKA PLAN ===== -->
    <canvas id="particleCanvas" class="canvas-background"></canvas>

    <div class="error-page">
        <div class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-title">Kariyer Yolunda Küçük Bir Sapma!</h1>
            <p class="error-message">
                Aradığınız sayfayı bulamadık. Ya bu sayfa silinmiş ya da url adresinde bir hata var. Endişelenmeyin, mükemmel CV'nizi oluşturmaya ana sayfadan devam edebilirsiniz.
            </p>
            <a href="index.html" class="error-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Ana Sayfaya Dön
            </a>
        </div>
    </div>

    <!-- Script yüklemeleri -->
    <script src="js/script.js?v=6"></script>
</body>
</html>
