<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CV'nizi önizleyin ve yazdırın.">
    <title>CV Önizleme - CV Oluşturucu</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Paylaşılan stil dosyası -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* ========================================================
           ONIZLEME.HTML - CV ÖNIZI LEME & YAZDIRMA SAYFASI
           ======================================================== */

        body.preview-page {
            background: transparent;
            overflow-x: hidden;
        }

        /* ===== ARAÇ ÇUBUĞU ===== */
        .preview-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(74, 14, 14, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding: var(--spacing-md) var(--spacing-xl);
            box-shadow: var(--shadow-lg);
        }

        .toolbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .toolbar-title {
            font-size: var(--font-size-lg);
            font-weight: 800;
            background: linear-gradient(135deg, var(--cherry-light) 0%, var(--cherry-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .toolbar-group {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
            flex-wrap: wrap;
        }

        /* ===== RENK PALETİ ===== */
        .color-palette-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .color-palette {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.active {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
            transform: scale(1.2);
        }

        /* ===== AKSIYON BUTONLARI ===== */
        .btn-toolbar-action {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .btn-print {
            background: linear-gradient(135deg, var(--cherry-ruby) 0%, var(--cherry-bright) 100%);
            color: white;
            box-shadow: var(--shadow-cherry-glow);
        }

        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-cherry-glow), var(--shadow-lg);
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-toolbar-action svg {
            width: 16px;
            height: 16px;
        }

        /* ===== ÖNİZLEME ALANI ===== */
        .preview-area {
            margin-top: 80px;
            padding: var(--spacing-2xl) var(--spacing-xl);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* ===== CV KAĞIDI ===== */
        .cv-paper {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 8px 50px rgba(0, 0, 0, 0.3);
            border-radius: 2px;
            position: relative;
            transform-origin: top center;
            margin-bottom: var(--spacing-2xl);
        }

        body.preview-page .cv-paper {
            max-height: calc(100vh - 160px);
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,0.22) transparent;
        }

        body.preview-page .cv-paper::-webkit-scrollbar {
            width: 8px;
        }

        body.preview-page .cv-paper::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.22);
            border-radius: 999px;
        }

        /* CV Şablonları Stilleri */
        .cv-paper.template-klasik {
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #222;
            padding: 0;
        }

        .cv-paper.template-klasik .cv-header {
            padding: 2rem 2.5rem 1.5rem;
            border-bottom: 3px solid #222;
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
        }

        .cv-paper.template-klasik .cv-body {
            padding: 1.5rem 2.5rem;
        }

        .cv-paper.template-modern {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            color: #222;
        }

        .cv-paper.template-modern .cv-modern-banner {
            background: linear-gradient(135deg, var(--accent-color, #C20000) 0%, color-mix(in srgb, var(--accent-color, #C20000) 70%, #000) 100%);
            padding: 2rem 2.5rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .cv-paper.template-modern .cv-modern-body {
            display: grid;
            grid-template-columns: 1fr 2fr;
        }

        .cv-paper.template-modern .cv-modern-sidebar {
            background: #f9f2f2;
            padding: 1.5rem 1.25rem;
            border-right: 1px solid #eee;
        }

        .cv-paper.template-modern .cv-modern-main {
            padding: 1.5rem 1.75rem;
        }

        .cv-paper.template-minimal {
            font-family: 'Montserrat', sans-serif;
            color: #333;
            padding: 2.5rem 3rem;
        }

        /* Ortak CV Stilleri */
        .cv-name {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .cv-section-title {
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .cv-entry {
            margin-bottom: 0.85rem;
        }

        .cv-field-empty {
            display: none !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .cv-paper {
                width: 180mm;
                min-height: 254mm;
            }

            .toolbar-title {
                display: none;
            }

            .toolbar-group {
                flex: 1;
                justify-content: flex-end;
            }
        }

        @media (max-width: 768px) {
            .preview-toolbar {
                padding: var(--spacing-sm) var(--spacing-md);
            }

            .toolbar-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .toolbar-group {
                width: 100%;
                justify-content: space-between;
            }

            .cv-paper {
                width: 100%;
                max-width: 380px;
            }

            .color-palette-label {
                display: none;
            }

            .btn-toolbar-action {
                padding: 0.5rem 0.75rem;
                font-size: 0.7rem;
            }

            .btn-toolbar-action svg {
                width: 14px;
                height: 14px;
            }
        }

        /* ===== YAZDIRMA CSS ===== */
        @media print {
            @page {
                size: A4;
                margin: 6mm;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html,
            body {
                width: 210mm;
                min-height: 297mm;
                background: white !important;
                margin: 0;
                padding: 0;
            }

            .preview-toolbar,
            .preview-area > *:not(.cv-paper) {
                display: none !important;
            }

            .preview-area {
                margin: 0;
                padding: 0;
                min-height: auto;
                display: block;
                overflow: visible;
            }

            .cv-paper {
                width: 198mm;
                min-height: auto;
                padding: 12mm;
                box-shadow: none;
                border-radius: 0;
                margin: 0;
                transform: none;
                overflow: visible;
                page-break-inside: avoid;
            }

            .cv-paper.template-modern {
                font-size: 0.94rem;
            }

            .cv-paper.template-modern .cv-modern-banner,
            .cv-paper.template-modern .cv-modern-body,
            .cv-paper.template-klasik .cv-header,
            .cv-paper.template-minimal .cv-header {
                page-break-inside: avoid;
            }

            .cv-entry,
            .cv-section,
            .cv-modern-sidebar,
            .cv-modern-main {
                page-break-inside: avoid;
            }

            canvas {
                display: none !important;
            }
        }
    </style>
</head>
<body class="preview-page">
    <!-- ===== CANVAS ARKA PLAN ===== -->
    <canvas id="particleCanvas" class="canvas-background"></canvas>

    <!-- ===== ARAÇ ÇUBUĞU ===== -->
    <div class="preview-toolbar">
        <div class="toolbar-content">
            <h1 class="toolbar-title">CV Önizleme</h1>
            
            <div class="toolbar-group">
                <!-- RENK PALETİ -->
                <div>
                    <span class="color-palette-label">Renk Teması:</span>
                    <div class="color-palette">
                        <button class="color-swatch active" data-color="#C20000" style="background:#C20000;" aria-label="Kırmızı tema" title="Kırmızı"></button>
                        <button class="color-swatch" data-color="#1a56db" style="background:#1a56db;" aria-label="Mavi tema" title="Mavi"></button>
                        <button class="color-swatch" data-color="#0e7c4a" style="background:#0e7c4a;" aria-label="Yeşil tema" title="Yeşil"></button>
                        <button class="color-swatch" data-color="#7c3aed" style="background:#7c3aed;" aria-label="Mor tema" title="Mor"></button>
                        <button class="color-swatch" data-color="#b45309" style="background:#b45309;" aria-label="Kahverengi tema" title="Kahverengi"></button>
                        <button class="color-swatch" data-color="#0891b2" style="background:#0891b2;" aria-label="Turkuaz tema" title="Turkuaz"></button>
                    </div>
                </div>

                <!-- AKSIYON BUTONLARI -->
                <button id="btnPrint" class="btn-toolbar-action btn-print" aria-label="CV'yi yazdır">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                    Yazdır
                </button>

                <button id="btnEdit" class="btn-toolbar-action btn-edit" aria-label="Düzenleyiciye dön">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="12 3 20 9 20 20 4 20 4 9 12 3"></polyline>
                    </svg>
                    Düzenle
                </button>
            </div>
        </div>
    </div>

    <!-- ===== ÖNİZLEME ALANI ===== -->
    <main class="preview-area" role="main">
        <!-- CV KAĞIDI -->
        <article class="cv-paper template-klasik" id="cvPaper" aria-label="CV önizlemesi">
            <!-- İçerik buraya dinamik olarak yüklenecek -->
        </article>
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="script.js"></script>
    <script>
        // ===== CV ÖNİZLEME VE YAZDIRMA SAYFASI =====

        const cvPaper = document.getElementById('cvPaper');

        // ===== RENK PALETİ =====
        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.addEventListener('click', function() {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                this.classList.add('active');

                const color = this.dataset.color;
                cvPaper.style.setProperty('--accent-color', color);
            });
        });

        // ===== CV VERİSİNİ YÜKLE =====
        function cvVerisiniYukle() {
            // localStorage'den aktif CV'yi al
            const cvListesi = JSON.parse(localStorage.getItem('cvListesi')) || [];
            const aktifCVAdi = localStorage.getItem('aktifCVAdi');

            let cvVerisi = null;
            if (aktifCVAdi) {
                cvVerisi = cvListesi.find(cv => cv.ad === aktifCVAdi);
            }

            if (!cvVerisi) {
                cvPaper.innerHTML = '<p style="padding: 2rem; text-align: center; color: #999;">CV yükleme başarısız. Lütfen bir CV seçin.</p>';
                return;
            }

            // Şablona göre CV'yi oluştur
            const template = cvVerisi.sablon || 'template-klasik';
            cvPaper.className = 'cv-paper ' + template;

            const k = cvVerisi.kisisel || {};

            if (template === 'template-modern') {
                renderModernCV(cvVerisi, k);
            } else if (template === 'template-minimal') {
                renderMinimalCV(cvVerisi, k);
            } else {
                renderKlasikCV(cvVerisi, k);
            }

            // Renk temasını uygula
            if (cvVerisi.aksanRengi) {
                cvPaper.style.setProperty('--accent-color', cvVerisi.aksanRengi);
                // Aktif renkli button'u bul ve seç
                document.querySelectorAll('.color-swatch').forEach(s => {
                    if (s.dataset.color === cvVerisi.aksanRengi) {
                        document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
                        s.classList.add('active');
                    }
                });
            }
        }

        // ===== KLASIK ŞABLON CV OLUŞTUR =====
        function renderKlasikCV(cvData, kisisel) {
            const html = `
                <div class="cv-header">
                    ${kisisel.foto ? `<img src="${escapeHtml(kisisel.foto)}" class="cv-photo" alt="Profil fotoğrafı" style="width:90px;height:90px;border-radius:50%;border:3px solid #222;flex-shrink:0;object-fit:cover;">` : `<div style="width:90px;height:90px;background:#f0f0f0;border-radius:50%;border:3px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.8rem;color:#aaa;">👤</div>`}
                    <div class="cv-header-info">
                        <h1 class="cv-name" style="font-size:2rem;color:#111;margin-bottom:0.25rem;">${escapeHtml(kisisel.ad || '')}</h1>
                        <p class="cv-title" style="font-size:1rem;color:#555;font-style:italic;margin-bottom:0.5rem;">${escapeHtml(kisisel.unvan || '')}</p>
                        <div class="cv-contact" style="font-size:0.78rem;color:#444;display:flex;flex-wrap:wrap;gap:0.25rem 1rem;">
                            ${kisisel.email ? `<span>✉ ${escapeHtml(kisisel.email)}</span>` : ''}
                            ${kisisel.telefon ? `<span>📞 ${escapeHtml(kisisel.telefon)}</span>` : ''}
                            ${kisisel.konum ? `<span>📍 ${escapeHtml(kisisel.konum)}</span>` : ''}
                            ${kisisel.linkedin ? `<span>🔗 ${escapeHtml(kisisel.linkedin)}</span>` : ''}
                            ${kisisel.website ? `<span>🌐 ${escapeHtml(kisisel.website)}</span>` : ''}
                        </div>
                    </div>
                </div>
                <div class="cv-body">
                    ${kisisel.ozet ? `<div class="cv-section"><h2 class="cv-section-title" style="font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#111;border-bottom:1.5px solid #111;padding-bottom:0.3rem;margin-bottom:0.75rem;">Profesyonel Özet</h2><p style="font-size:0.85rem;color:#444;line-height:1.65;">${escapeHtml(kisisel.ozet)}</p></div>` : ''}
                    ${cvData.deneyimler?.length ? `<div class="cv-section"><h2 class="cv-section-title" style="font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#111;border-bottom:1.5px solid #111;padding-bottom:0.3rem;margin-bottom:0.75rem;">İş Deneyimi</h2>${cvData.deneyimler.map(d => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;"><div><div style="font-size:0.9rem;font-weight:700;color:#111;">${escapeHtml(d.pozisyon || '')}</div><div style="font-size:0.82rem;color:#555;font-style:italic;">${escapeHtml(d.sirket || '')}</div></div><div style="font-size:0.78rem;color:#777;white-space:nowrap;">${escapeHtml(d.tarih || '')}</div></div>${d.aciklama ? `<p style="font-size:0.82rem;color:#444;line-height:1.55;margin-top:0.2rem;">${escapeHtml(d.aciklama)}</p>` : ''}</div>`).join('')}</div>` : ''}
                    ${cvData.egitimler?.length ? `<div class="cv-section"><h2 class="cv-section-title" style="font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#111;border-bottom:1.5px solid #111;padding-bottom:0.3rem;margin-bottom:0.75rem;">Eğitim</h2>${cvData.egitimler.map(e => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;"><div><div style="font-size:0.9rem;font-weight:700;color:#111;">${escapeHtml(e.bolum || '')}</div><div style="font-size:0.82rem;color:#555;font-style:italic;">${escapeHtml(e.okul || '')}${e.not ? ` • Not: ${escapeHtml(e.not)}` : ''}</div></div><div style="font-size:0.78rem;color:#777;white-space:nowrap;">${escapeHtml(e.tarih || '')}</div></div></div>`).join('')}</div>` : ''}
                    ${cvData.beceriler?.length ? `<div class="cv-section"><h2 class="cv-section-title" style="font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#111;border-bottom:1.5px solid #111;padding-bottom:0.3rem;margin-bottom:0.75rem;">Beceriler</h2>${cvData.beceriler.map(b => `<div style="margin-bottom:0.5rem;"><div style="display:flex;justify-content:space-between;font-size:0.8rem;font-weight:600;color:#333;margin-bottom:0.2rem;"><span>${escapeHtml(b.ad || '')}</span><span>${b.seviye || 0}%</span></div><div style="height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden;"><div style="height:100%;background:#333;border-radius:3px;width:${b.seviye || 0}%;"></div></div></div>`).join('')}</div>` : ''}
                    ${cvData.projeler?.length ? `<div class="cv-section"><h2 class="cv-section-title" style="font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#111;border-bottom:1.5px solid #111;padding-bottom:0.3rem;margin-bottom:0.75rem;">Projeler</h2>${cvData.projeler.map(p => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;"><div><div style="font-size:0.9rem;font-weight:700;color:#111;">${escapeHtml(p.ad || '')}</div>${p.teknoloji ? `<div style="font-size:0.82rem;color:#555;font-style:italic;">${escapeHtml(p.teknoloji)}</div>` : ''}</div></div>${p.aciklama ? `<p style="font-size:0.82rem;color:#444;line-height:1.55;margin-top:0.2rem;">${escapeHtml(p.aciklama)}</p>` : ''}</div>`).join('')}</div>` : ''}
                </div>
            `;
            cvPaper.innerHTML = html;
        }

        function renderModernCV(cvData, kisisel) {
            const html = `
                <div class="cv-modern-banner">
                    ${kisisel.foto ? `<img src="${escapeHtml(kisisel.foto)}" class="cv-photo" alt="Profil fotoğrafı" style="width:100px;height:100px;border-radius:50%;border:4px solid rgba(255,255,255,0.4);flex-shrink:0;object-fit:cover;">` : `<div style="width:100px;height:100px;background:rgba(255,255,255,0.15);border-radius:50%;border:4px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:2rem;color:rgba(255,255,255,0.5);">👤</div>`}
                    <div>
                        <h1 class="cv-name" style="font-size:1.8rem;font-weight:900;letter-spacing:-0.5px;color:white;margin-bottom:0.2rem;">${escapeHtml(kisisel.ad || '')}</h1>
                        <p class="cv-title" style="font-size:0.9rem;color:rgba(255,255,255,0.8);font-weight:600;margin-bottom:0.4rem;">${escapeHtml(kisisel.unvan || '')}</p>
                        <div class="cv-contact" style="font-size:0.75rem;color:rgba(255,255,255,0.75);display:flex;flex-wrap:wrap;gap:0.2rem 0.8rem;">
                            ${kisisel.email ? `<span>✉ ${escapeHtml(kisisel.email)}</span>` : ''}
                            ${kisisel.telefon ? `<span>📞 ${escapeHtml(kisisel.telefon)}</span>` : ''}
                            ${kisisel.konum ? `<span>📍 ${escapeHtml(kisisel.konum)}</span>` : ''}
                        </div>
                    </div>
                </div>
                <div class="cv-modern-body">
                    <div class="cv-modern-sidebar">
                        ${kisisel.ozet ? `<div class="cv-section"><h2 class="cv-section-title">Özet</h2><p style="font-size:0.82rem;color:#444;line-height:1.6;">${escapeHtml(kisisel.ozet)}</p></div>` : ''}
                        ${cvData.beceriler?.length ? `<div class="cv-section"><h2 class="cv-section-title">Beceriler</h2>${cvData.beceriler.map(b => `<div style="margin-bottom:0.6rem;"><div style="display:flex;justify-content:space-between;font-size:0.76rem;font-weight:600;color:#333;margin-bottom:0.2rem;"><span>${escapeHtml(b.ad || '')}</span><span>${b.seviye || 0}%</span></div><div style="height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;"><div style="height:100%;background:var(--accent-color,#C20000);border-radius:3px;width:${b.seviye || 0}%;"></div></div></div>`).join('')}</div>` : ''}
                    </div>
                    <div class="cv-modern-main">
                        ${cvData.deneyimler?.length ? `<div class="cv-section"><h2 class="cv-section-title">İş Deneyimi</h2>${cvData.deneyimler.map(d => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div style="font-size:0.85rem;font-weight:700;color:#111;">${escapeHtml(d.pozisyon || '')}</div><div style="font-size:0.78rem;color:var(--accent-color,#C20000);font-weight:600;">${escapeHtml(d.sirket || '')}</div></div><div style="font-size:0.7rem;color:#888;white-space:nowrap;">${escapeHtml(d.tarih || '')}</div></div>${d.aciklama ? `<p style="font-size:0.78rem;color:#555;line-height:1.5;margin-top:0.2rem;">${escapeHtml(d.aciklama)}</p>` : ''}</div>`).join('')}</div>` : ''}
                        ${cvData.egitimler?.length ? `<div class="cv-section"><h2 class="cv-section-title">Eğitim</h2>${cvData.egitimler.map(e => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div style="font-size:0.85rem;font-weight:700;color:#111;">${escapeHtml(e.bolum || '')}</div><div style="font-size:0.78rem;color:var(--accent-color,#C20000);font-weight:600;">${escapeHtml(e.okul || '')}${e.not ? ` • ${escapeHtml(e.not)}` : ''}</div></div><div style="font-size:0.7rem;color:#888;white-space:nowrap;">${escapeHtml(e.tarih || '')}</div></div></div>`).join('')}</div>` : ''}
                        ${cvData.projeler?.length ? `<div class="cv-section"><h2 class="cv-section-title">Projeler</h2>${cvData.projeler.map(p => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div style="font-size:0.85rem;font-weight:700;color:#111;">${escapeHtml(p.ad || '')}</div>${p.teknoloji ? `<div style="font-size:0.78rem;color:var(--accent-color,#C20000);font-weight:600;">${escapeHtml(p.teknoloji)}</div>` : ''}</div></div>${p.aciklama ? `<p style="font-size:0.78rem;color:#555;line-height:1.5;margin-top:0.2rem;">${escapeHtml(p.aciklama)}</p>` : ''}</div>`).join('')}</div>` : ''}
                    </div>
                </div>
            `;
            cvPaper.innerHTML = html;
        }

        function renderMinimalCV(cvData, kisisel) {
            const html = `
                <div class="cv-header" style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid #eee;">
                    ${kisisel.foto ? `<img src="${escapeHtml(kisisel.foto)}" style="width:80px;height:80px;border-radius:50%;border:3px solid var(--accent-color,#F08080);flex-shrink:0;object-fit:cover;">` : `<div style="width:80px;height:80px;background:#fff0f5;border-radius:50%;border:3px solid var(--accent-color,#F08080);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.6rem;color:var(--accent-color,#F08080);">👤</div>`}
                    <div>
                        <h1 class="cv-name" style="font-size:1.8rem;font-weight:900;color:#111;letter-spacing:-0.5px;margin-bottom:0.2rem;">${escapeHtml(kisisel.ad || '')}</h1>
                        <p class="cv-title" style="font-size:0.88rem;color:var(--accent-color,#F08080);font-weight:600;margin-bottom:0.4rem;">${escapeHtml(kisisel.unvan || '')}</p>
                        <div style="font-size:0.75rem;color:#888;display:flex;flex-wrap:wrap;gap:0.2rem 0.75rem;">
                            ${kisisel.email ? `<span>✉ ${escapeHtml(kisisel.email)}</span>` : ''}
                            ${kisisel.telefon ? `<span>📞 ${escapeHtml(kisisel.telefon)}</span>` : ''}
                            ${kisisel.konum ? `<span>📍 ${escapeHtml(kisisel.konum)}</span>` : ''}
                        </div>
                    </div>
                </div>
                ${kisisel.ozet ? `<div class="cv-section" style="margin-bottom:1.4rem;"><h2 class="cv-section-title" style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--accent-color,#F08080);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem;"><span>Profesyonel Özet</span><div style="flex:1;height:1px;background:var(--accent-color,#F08080);opacity:0.3;"></div></h2><p style="font-size:0.83rem;color:#555;line-height:1.65;">${escapeHtml(kisisel.ozet)}</p></div>` : ''}
                ${cvData.deneyimler?.length ? `<div class="cv-section" style="margin-bottom:1.4rem;"><h2 class="cv-section-title" style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--accent-color,#F08080);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem;"><span>İş Deneyimi</span><div style="flex:1;height:1px;background:var(--accent-color,#F08080);opacity:0.3;"></div></h2>${cvData.deneyimler.map(d => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div style="font-size:0.88rem;font-weight:700;color:#222;">${escapeHtml(d.pozisyon || '')}</div><div style="font-size:0.8rem;color:#777;">${escapeHtml(d.sirket || '')}</div></div><div style="font-size:0.75rem;color:#aaa;white-space:nowrap;">${escapeHtml(d.tarih || '')}</div></div>${d.aciklama ? `<p style="font-size:0.8rem;color:#555;line-height:1.55;margin-top:0.2rem;">${escapeHtml(d.aciklama)}</p>` : ''}</div>`).join('')}</div>` : ''}
                ${cvData.egitimler?.length ? `<div class="cv-section" style="margin-bottom:1.4rem;"><h2 class="cv-section-title" style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--accent-color,#F08080);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem;"><span>Eğitim</span><div style="flex:1;height:1px;background:var(--accent-color,#F08080);opacity:0.3;"></div></h2>${cvData.egitimler.map(e => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div style="font-size:0.88rem;font-weight:700;color:#222;">${escapeHtml(e.bolum || '')}</div><div style="font-size:0.8rem;color:#777;">${escapeHtml(e.okul || '')}${e.not ? ` • ${escapeHtml(e.not)}` : ''}</div></div><div style="font-size:0.75rem;color:#aaa;white-space:nowrap;">${escapeHtml(e.tarih || '')}</div></div></div>`).join('')}</div>` : ''}
                ${cvData.beceriler?.length ? `<div class="cv-section" style="margin-bottom:1.4rem;"><h2 class="cv-section-title" style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--accent-color,#F08080);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem;"><span>Beceriler</span><div style="flex:1;height:1px;background:var(--accent-color,#F08080);opacity:0.3;"></div></h2>${cvData.beceriler.map(b => `<div style="margin-bottom:0.5rem;"><div style="display:flex;justify-content:space-between;font-size:0.78rem;font-weight:600;color:#333;margin-bottom:0.2rem;"><span>${escapeHtml(b.ad || '')}</span><span>${b.seviye || 0}%</span></div><div style="height:4px;background:rgba(240,128,128,0.15);border-radius:2px;overflow:hidden;"><div style="height:100%;background:var(--accent-color,#F08080);border-radius:2px;width:${b.seviye || 0}%;"></div></div></div>`).join('')}</div>` : ''}
                ${cvData.projeler?.length ? `<div class="cv-section" style="margin-bottom:1.4rem;"><h2 class="cv-section-title" style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--accent-color,#F08080);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem;"><span>Projeler</span><div style="flex:1;height:1px;background:var(--accent-color,#F08080);opacity:0.3;"></div></h2>${cvData.projeler.map(p => `<div class="cv-entry" style="margin-bottom:0.85rem;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div style="font-size:0.88rem;font-weight:700;color:#222;">${escapeHtml(p.ad || '')}</div>${p.teknoloji ? `<div style="font-size:0.8rem;color:#777;">${escapeHtml(p.teknoloji)}</div>` : ''}</div></div>${p.aciklama ? `<p style="font-size:0.8rem;color:#555;line-height:1.55;margin-top:0.2rem;">${escapeHtml(p.aciklama)}</p>` : ''}</div>`).join('')}</div>` : ''}
            `;
            cvPaper.innerHTML = html;
        }

        // ===== XSS KORUMA =====
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== YAZDIRMA =====
        document.getElementById('btnPrint').addEventListener('click', () => {
            console.log('🖨️ CV yazdırılıyor...');
            window.print();
        });

        // ===== DÜZENLEYİCİYE DÖN =====
        document.getElementById('btnEdit').addEventListener('click', () => {
            const aktifCVAdi = localStorage.getItem('aktifCVAdi');
            if (aktifCVAdi) {
                window.location.href = 'editor.html?mode=edit&cv=' + encodeURIComponent(aktifCVAdi);
            } else {
                window.location.href = 'editor.html';
            }
        });

        // ===== SAYFA YÜKLENÜNCE =====
        document.addEventListener('DOMContentLoaded', () => {
            cvVerisiniYukle();
            console.log('👀 CV önizleme sayfası yüklendi.');
        });
    </script>
</body>
</html>
