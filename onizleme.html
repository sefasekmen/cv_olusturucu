<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CV'nizi önizleyin ve yazdırın.">
    <title>CV Önizleme - CV Oluşturucu</title>
    <link rel="icon" type="image/webp" href="logo.webp">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Paylaşılan stil dosyası -->
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/cv-templates.css?v=6">

    <style>
        /* ========================================================
           ONIZLEME.HTML - CV ÖNIZI LEME & YAZDIRMA SAYFASI
           ======================================================== */

        body.preview-page {
            background: transparent;
            overflow-x: hidden;
        }

        /* ===== ARAÇ ÇUBUĞU ===== */
        .preview-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(74, 14, 14, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding: var(--spacing-md) var(--spacing-xl);
            box-shadow: var(--shadow-lg);
        }

        .toolbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .toolbar-title {
            font-size: var(--font-size-lg);
            font-weight: 800;
            background: linear-gradient(135deg, var(--cherry-light) 0%, var(--cherry-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .toolbar-group {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
            flex-wrap: wrap;
        }

        /* ===== RENK PALETİ ===== */
        .color-palette-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .color-palette {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.active {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
            transform: scale(1.2);
        }

        /* ===== AKSIYON BUTONLARI ===== */
        .btn-toolbar-action {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .btn-print {
            background: linear-gradient(135deg, var(--cherry-ruby) 0%, var(--cherry-bright) 100%);
            color: white;
            box-shadow: var(--shadow-cherry-glow);
        }

        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-cherry-glow), var(--shadow-lg);
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-toolbar-action svg {
            width: 16px;
            height: 16px;
        }

        /* ===== ÖNİZLEME ALANI ===== */
        .preview-area {
            margin-top: 80px;
            padding: var(--spacing-2xl) var(--spacing-xl);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .toolbar-title {
                display: none;
            }

            .toolbar-group {
                flex: 1;
                justify-content: flex-end;
            }
        }

        @media (max-width: 768px) {
            .preview-toolbar {
                padding: var(--spacing-sm) var(--spacing-md);
            }

            .toolbar-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .toolbar-group {
                width: 100%;
                justify-content: space-between;
            }

            .color-palette-label {
                display: none;
            }

            .btn-toolbar-action {
                padding: 0.5rem 0.75rem;
                font-size: 0.7rem;
            }

            .btn-toolbar-action svg {
                width: 14px;
                height: 14px;
            }

            .preview-area {
                overflow-x: hidden !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                align-items: flex-start !important;
            }

            .cv-paper {
                width: 210mm !important;
                min-width: 210mm !important;
                flex-shrink: 0 !important;
            }
        }
    </style>
</head>
<body class="preview-page">
    <!-- ===== CANVAS ARKA PLAN ===== -->
    <canvas id="particleCanvas" class="canvas-background"></canvas>

    <!-- ===== ARAÇ ÇUBUĞU ===== -->
    <div class="preview-toolbar">
        <div class="toolbar-content">
            <h1 class="toolbar-title">CV Önizleme</h1>
            
            <div class="toolbar-group">
                <button onclick="window.toggleUiLanguage()" class="lang-toggle-btn" title="Switch to English" style="background: transparent; border: 1px solid #ddd; padding: 0.5rem; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; margin-right: 15px;">🇹🇷 TR</button>
                <!-- RENK PALETİ -->
                <div>
                    <span class="color-palette-label">Renk Teması:</span>
                    <div class="color-palette">
                        <button class="color-swatch active" data-color="#C20000" style="background:#C20000;" aria-label="Kırmızı tema" title="Kırmızı"></button>
                        <button class="color-swatch" data-color="#1a56db" style="background:#1a56db;" aria-label="Mavi tema" title="Mavi"></button>
                        <button class="color-swatch" data-color="#0e7c4a" style="background:#0e7c4a;" aria-label="Yeşil tema" title="Yeşil"></button>
                        <button class="color-swatch" data-color="#7c3aed" style="background:#7c3aed;" aria-label="Mor tema" title="Mor"></button>
                        <button class="color-swatch" data-color="#b45309" style="background:#b45309;" aria-label="Kahverengi tema" title="Kahverengi"></button>
                        <button class="color-swatch" data-color="#0891b2" style="background:#0891b2;" aria-label="Turkuaz tema" title="Turkuaz"></button>
                    </div>
                </div>

                <!-- AKSIYON BUTONLARI -->
                <button id="btnPrint" class="btn-toolbar-action btn-print" aria-label="CV'yi yazdır">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                    Yazdır
                </button>

                <button id="btnEdit" class="btn-toolbar-action btn-edit" aria-label="Düzenleyiciye dön">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="12 3 20 9 20 20 4 20 4 9 12 3"></polyline>
                    </svg>
                    Düzenle
                </button>
            </div>
        </div>
    </div>

    <!-- ===== ÖNİZLEME ALANI ===== -->
    <main class="preview-area" role="main">
        <!-- CV KAĞIDI -->
        <article class="cv-paper template-klasik" id="cvPaper" aria-label="CV önizlemesi">
            <!-- İçerik buraya dinamik olarak yüklenecek -->
        </article>
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/saveManager.js?v=5"></script>
    <script src="js/script.js?v=6"></script>
    <script src="js/cv-render.js?v=6"></script>
    <script>
        const cvPaper = document.getElementById('cvPaper');
        const printRoot = document.documentElement;

        function yazdirmaTemasiniGuncelle() {
            const techAktifMi = cvPaper.classList.contains('template-tech');
            printRoot.classList.toggle('print-tech-paper', techAktifMi);
            document.body.classList.toggle('print-tech-paper', techAktifMi);
        }

        window.addEventListener('beforeprint', yazdirmaTemasiniGuncelle);
        window.addEventListener('afterprint', () => {
            printRoot.classList.remove('print-tech-paper');
            document.body.classList.remove('print-tech-paper');
        });

        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.addEventListener('click', function () {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                cvPaper.style.setProperty('--accent-color', this.dataset.color);
            });
        });

        async function cvVerisiniYukle() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            let cvVerisi = null;

            // Loading göster
            cvPaper.innerHTML = '<p style="padding:2rem;text-align:center;color:#999;">CV yükleniyor...</p>';

            // Auth'un hazır olmasını bekle
            await new Promise((resolve) => {
                if (window.auth && window.auth.currentUser) {
                    resolve();
                } else if (window.auth) {
                    const unsubscribe = window.auth.onAuthStateChanged(() => {
                        unsubscribe();
                        resolve();
                    });
                    // 3 saniye timeout
                    setTimeout(resolve, 3000);
                } else {
                    resolve();
                }
            });

            // saveManager sync bekle
            if (window.auth && window.auth.currentUser && window.saveManager) {
                try {
                    await window.saveManager.syncWithFirebase();
                } catch(e) {}
            }

            if (idParam) {
                // 1. saveManager.loadCV ile Firebase'den yükle
                if (typeof saveManager !== 'undefined') {
                    try {
                        cvVerisi = await saveManager.loadCV(idParam);
                    } catch (e) {
                        console.warn('loadCV failed for id:', e);
                    }
                }

                // 2. ID ile bulunamadıysa ad/name ile dene
                if (!cvVerisi && typeof saveManager !== 'undefined') {
                    try {
                        const allCvs = await saveManager.getAllCVs();
                        cvVerisi = allCvs.find(c => c.name === idParam || c.ad === idParam);
                    } catch (e) {}
                }
            } else {
                // URL parametresi yoksa, Firebase'den son güncellenen CV'yi yükle
                if (typeof saveManager !== 'undefined') {
                    try {
                        const allCvs = await saveManager.getAllCVs();
                        if (allCvs.length > 0) {
                            // En son güncellenen CV'yi seç
                            allCvs.sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
                            cvVerisi = allCvs[0];
                        }
                    } catch(e) {
                        console.warn('Firebase CV yükleme başarısız:', e);
                    }
                }
            }

            if (!cvVerisi) {
                cvPaper.innerHTML = '<p style="padding:2rem;text-align:center;color:#999;">CV yükleme başarısız. Lütfen bir CV seçin.</p>';
                return;
            }

            if (typeof CVRender !== 'undefined') {
                CVRender.renderCV(cvPaper, cvVerisi);
            } else {
                cvPaper.innerHTML = '<p style="padding:2rem;text-align:center;color:#999;">Render modülü yüklenemedi.</p>';
            }

            if (cvVerisi.aksanRengi || cvVerisi.accentColor) {
                const renk = cvVerisi.aksanRengi || cvVerisi.accentColor;
                document.querySelectorAll('.color-swatch').forEach(s => {
                    s.classList.toggle('active', s.dataset.color === renk);
                });
            }
        }

        document.getElementById('btnPrint').addEventListener('click', () => {
            yazdirmaTemasiniGuncelle();
            window.print();
        });

        document.getElementById('btnEdit').addEventListener('click', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            
            if (idParam) {
                window.location.href = 'editor.html?id=' + encodeURIComponent(idParam);
            } else {
                window.location.href = 'editor.html';
            }
        });

        document.addEventListener('DOMContentLoaded', cvVerisiniYukle);
    </script>
    <script src="js/i18n.js"></script>
</body>
</html>
